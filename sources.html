<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline';"
  />
  <title>Exum — Biblioteca y Explorador</title>
  <link rel="stylesheet" href="./styles/floating.css" />
</head>
<body>
  <div class="float-shell">
    <header class="float-titlebar">
      <span class="float-title">EXUM — BIBLIOTECA Y EXPLORADOR (LIB)</span>
      <div class="float-actions">
        <button id="btn-pin" class="float-btn" title="Mantener siempre visible">PIN</button>
        <button id="btn-min" class="float-btn" title="Minimizar">_</button>
        <button id="btn-close" class="float-btn float-btn-close" title="Cerrar">×</button>
      </div>
    </header>

    <main class="float-body">
      <div class="tabs-bar">
        <button id="tab-library" class="float-btn active">Mi Música</button>
        <button id="tab-discover" class="float-btn">Explorar</button>
        <button id="tab-radios" class="float-btn">Radios</button>
        <button id="tab-urls" class="float-btn">URL/.m3u</button>
      </div>

      <!-- Pestaña 1: Biblioteca Local (Portadas ID3, Artistas, Álbumes, Favoritos) -->
      <section id="panel-library" class="tab-panel">
        <div class="search-row">
          <input
            id="lib-search-input"
            class="float-input"
            type="text"
            placeholder="Buscar en tu música (título, artista o álbum)..."
          />
          <button id="btn-lib-folder" class="float-btn" title="Elegir o cambiar tu carpeta de música">Carpeta</button>
          <button id="btn-lib-load-all" class="float-btn" title="Cargar las canciones filtradas en Exum">Cargar vista</button>
        </div>

        <div class="filter-row">
          <button id="btn-lib-all" class="chip-btn active">Todo</button>
          <button id="btn-lib-favs" class="chip-btn">Favoritos (0)</button>
          <select id="lib-artist-filter" class="float-select" title="Filtrar por artista">
            <option value="">Todos los artistas</option>
          </select>
          <select id="lib-album-filter" class="float-select" title="Filtrar por álbum">
            <option value="">Todos los álbumes</option>
          </select>
        </div>

        <div id="lib-status-banner" class="status-banner">Cargando biblioteca local...</div>
        <div id="lib-tracks-list" class="source-list"></div>
      </section>

      <!-- Pestaña 2: Explorador Libre (Audius + Internet Archive CC) -->
      <section id="panel-discover" class="tab-panel hidden">
        <div class="sub-tabs">
          <button id="sub-audius" class="float-btn active">Audius (Streaming libre)</button>
          <button id="sub-archive" class="float-btn">Archive.org (Álbumes MP3)</button>
        </div>

        <div class="search-row">
          <input
            id="discover-search-input"
            class="float-input"
            type="text"
            placeholder="Buscar música libre por género, artista o álbum..."
          />
          <button id="btn-discover-search" class="float-btn">Buscar</button>
        </div>

        <div class="chips-row">
          <button class="chip-btn discover-tag-chip" data-tag="lofi">lofi</button>
          <button class="chip-btn discover-tag-chip" data-tag="synthwave">synthwave</button>
          <button class="chip-btn discover-tag-chip" data-tag="ambient">ambient</button>
          <button class="chip-btn discover-tag-chip" data-tag="electronic">electronic</button>
          <button class="chip-btn discover-tag-chip" data-tag="rock">rock</button>
          <button class="chip-btn discover-tag-chip" data-tag="jazz">jazz</button>
          <button class="chip-btn discover-tag-chip" data-tag="phonk">phonk</button>
          <button class="chip-btn discover-tag-chip" data-tag="classical">classical</button>
        </div>

        <div id="discover-status-banner" class="status-banner hidden"></div>
        <div id="discover-results-list" class="source-list">
          <div class="lyrics-message">Explora música libre y gratuita directo en Exum (sin cuentas).</div>
        </div>
      </section>

      <!-- Pestaña 3: Buscador Mundial de Radios (+30,000 emisoras) -->
      <section id="panel-radios" class="tab-panel hidden">
        <div class="search-row">
          <input
            id="radio-search-input"
            class="float-input"
            type="text"
            placeholder="Buscar radio o género (ej: lofi, synthwave, rock, japan)..."
          />
          <button id="btn-radio-search" class="float-btn">Buscar</button>
        </div>
        <div class="chips-row">
          <button class="chip-btn radio-tag-chip" data-tag="lofi">lofi</button>
          <button class="chip-btn radio-tag-chip" data-tag="synthwave">synthwave</button>
          <button class="chip-btn radio-tag-chip" data-tag="chillout">chillout</button>
          <button class="chip-btn radio-tag-chip" data-tag="ambient">ambient</button>
          <button class="chip-btn radio-tag-chip" data-tag="rock">rock</button>
          <button class="chip-btn radio-tag-chip" data-tag="anime">anime</button>
          <button class="chip-btn radio-tag-chip" data-tag="jazz">jazz</button>
        </div>
        <div id="radio-results-list" class="source-list">
          <div class="lyrics-message">Cargando radios populares del mundo...</div>
        </div>
      </section>

      <!-- Pestaña 4: URLs directas, .m3u / .pls y descarga de audio abierto -->
      <section id="panel-urls" class="tab-panel hidden">
        <div class="form-stack">
          <input id="stream-name" class="float-input" type="text" placeholder="Nombre (opcional)..." />
          <input
            id="stream-url"
            class="float-input"
            type="url"
            placeholder="https://... (audio directo .mp3/.wav/.flac o radio .m3u/.pls)"
          />
          <div class="search-row">
            <button id="btn-add-stream" class="float-btn">Escuchar y guardar</button>
            <button
              id="btn-download-audio"
              class="float-btn"
              title="Descarga una URL directa de audio abierto (.mp3/.wav/.flac) a tu carpeta local"
            >
              Guardar MP3 local
            </button>
          </div>
        </div>
        <div id="url-status-banner" class="status-banner hidden"></div>
        <div id="streams-list" class="source-list"></div>
      </section>
    </main>
  </div>

  <script type="module" src="./dist/renderer/sourcesWindow.js"></script>
</body>
</html>
