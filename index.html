<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; media-src 'self' file: http: https:; img-src 'self' data:; style-src 'self' 'unsafe-inline';"
  />
  <title>Exum</title>
  <link rel="stylesheet" href="./styles/classic.css" />
</head>
<body>
  <div id="player-shell" class="player-shell">
    <!-- Modo Mini-Barra Flotante (Shade Mode) -->
    <section id="mini-bar" class="mini-bar">
      <div class="mini-info">
        <span id="mini-time" class="mini-time">00:00</span>
        <span id="mini-title" class="mini-title">Exum — Sin canción</span>
      </div>
      <div class="mini-controls">
        <button id="mini-prev" class="mini-btn" title="Anterior">⏮</button>
        <button id="mini-play" class="mini-btn" title="Play / Pause">⏯</button>
        <button id="mini-next" class="mini-btn" title="Siguiente">⏭</button>
        <button id="mini-restore" class="mini-btn" title="Restaurar tamaño">⤢</button>
      </div>
    </section>

    <!-- Bloque Winamp (275px base que escala proporcionalmente al 100% del ancho de ventana) -->
    <div id="winamp-decks" class="winamp-decks normal-only">
      <!-- 1. Main Deck (275x116) -->
      <div class="wsz-main-deck">
        <div class="wsz-titlebar">
          <button id="wsz-main-menu-btn" class="wsz-menu-btn" title="Menú Exum (Skins, Letras, Biblioteca)">☰</button>
          <span class="wsz-fallback-brand">EXUM v1.1</span>
          <button id="wsz-win-min" class="wsz-win-btn" title="Minimizar">_</button>
          <button id="wsz-win-shade" class="wsz-win-btn" title="Modo mini-barra flotante">▬</button>
          <button id="wsz-win-close" class="wsz-win-btn" title="Cerrar">×</button>
        </div>

        <!-- Menú desplegable superior izquierdo (sin emojis) -->
        <div id="wsz-main-menu" class="wsz-popup-menu main-menu-pos hidden">
          <button class="wsz-menu-item" data-main-action="skins">Skins (.wsz)</button>
          <button class="wsz-menu-item" data-main-action="lyrics">Letras (LRC)</button>
          <button class="wsz-menu-item" data-main-action="sources">Biblioteca (LIB)</button>
          <div class="wsz-menu-sep"></div>
          <button class="wsz-menu-item" data-main-action="folder">Elegir carpeta</button>
          <button class="wsz-menu-item" data-main-action="files">Agregar archivos</button>
          <div class="wsz-menu-sep"></div>
          <button class="wsz-menu-item" data-main-action="pin">Siempre encima</button>
          <button class="wsz-menu-item" data-main-action="mini">Mini-barra</button>
        </div>

        <!-- Barra vertical ClutterBar (O A I D V) -->
        <div class="wsz-clutterbar">
          <button id="wsz-clutter-o" class="wsz-clutter-btn" title="Opciones / Skins">O</button>
          <button id="wsz-clutter-a" class="wsz-clutter-btn" title="Siempre encima (Always on Top)">A</button>
          <button id="wsz-clutter-i" class="wsz-clutter-btn" title="Info de la canción">I</button>
          <button id="wsz-clutter-d" class="wsz-clutter-btn" title="Tamaño doble (2x)">D</button>
          <button id="wsz-clutter-v" class="wsz-clutter-btn" title="Cambiar visualizador">V</button>
        </div>

        <!-- Indicador Play / Pause / Stop (playpaus.bmp) -->
        <div id="wsz-playpaus" class="wsz-playpaus state-stopped" title="Estado de reproducción">■</div>
        <span id="wsz-minus" class="wsz-minus hidden">-</span>

        <!-- Reloj clicable -->
        <div id="wsz-clock" class="wsz-clock" title="Clic para alternar tiempo transcurrido / restante">
          <span id="wsz-d0" class="wsz-digit">0</span>
          <span class="wsz-digit-gap"></span>
          <span id="wsz-d1" class="wsz-digit">0</span>
          <span class="wsz-digit-colon">:</span>
          <span id="wsz-d2" class="wsz-digit">0</span>
          <span class="wsz-digit-gap"></span>
          <span id="wsz-d3" class="wsz-digit">0</span>
        </div>

        <canvas
          id="wsz-vis-canvas"
          class="wsz-vis-canvas"
          width="76"
          height="16"
          title="Clic para cambiar visualizador (Barras / Onda / Off)"
        ></canvas>

        <!-- Marquee -->
        <div id="wsz-track-title" class="wsz-track-title">
          <span id="wsz-marquee-text" class="wsz-marquee-text">EXUM — ARRASTRA MP3 O ELIGE CARPETA</span>
        </div>

        <!-- Indicadores Kbps, Khz y Mono/Stereo -->
        <div id="wsz-kbps" class="wsz-kbps" title="Bitrate (kbps)">---</div>
        <div id="wsz-khz" class="wsz-khz" title="Frecuencia (kHz)">--</div>
        <div id="wsz-mono" class="wsz-mono" title="Mono">MONO</div>
        <div id="wsz-stereo" class="wsz-stereo" title="Stereo">STEREO</div>

        <!-- Volumen con perilla real -->
        <div class="wsz-vol-wrap">
          <div id="wsz-vol-bg" class="wsz-vol-bg"></div>
          <div id="wsz-vol-thumb" class="wsz-vol-thumb"></div>
          <input id="wsz-vol-slider" class="wsz-vol-slider" type="range" min="0" max="100" value="80" title="Volumen" />
        </div>

        <!-- Balance con perilla real -->
        <div class="wsz-bal-wrap">
          <div id="wsz-bal-bg" class="wsz-bal-bg"></div>
          <div id="wsz-bal-thumb" class="wsz-bal-thumb"></div>
          <input id="wsz-bal-slider" class="wsz-bal-slider" type="range" min="-100" max="100" value="0" title="Balance (doble clic para centrar)" />
        </div>

        <!-- Botones EQ y PL -->
        <button id="wsz-btn-eq-toggle" class="wsz-eq-toggle active" title="Mostrar / ocultar Ecualizador">EQ</button>
        <button id="wsz-btn-pl-toggle" class="wsz-pl-toggle active" title="Mostrar / ocultar Playlist">PL</button>

        <!-- Barra de progreso -->
        <div class="wsz-pos-wrap">
          <div id="wsz-pos-thumb" class="wsz-pos-thumb"></div>
          <input id="wsz-pos-slider" class="wsz-pos-slider" type="range" min="0" max="0" step="0.1" value="0" />
        </div>

        <!-- Transporte -->
        <button id="wsz-btn-prev" class="wsz-cbtn" title="Anterior">⏮</button>
        <button id="wsz-btn-play" class="wsz-cbtn" title="Play">▶</button>
        <button id="wsz-btn-pause" class="wsz-cbtn" title="Pause">⏸</button>
        <button id="wsz-btn-stop" class="wsz-cbtn" title="Stop">⏹</button>
        <button id="wsz-btn-next" class="wsz-cbtn" title="Siguiente">⏭</button>
        <button id="wsz-btn-eject" class="wsz-cbtn" title="Agregar archivos">⏏</button>

        <button id="wsz-btn-shuffle" class="wsz-shufrep-btn" title="Aleatorio">SHUF</button>
        <button id="wsz-btn-repeat" class="wsz-shufrep-btn" title="Repetir">REP</button>
      </div>

      <!-- 2. Equalizer Deck (275x116 normal / 275x14 en Shade Mode) -->
      <div id="wsz-eq-deck" class="wsz-eq-deck">
        <button id="wsz-eq-min" class="wsz-panel-min-btn" title="Resumir / expandir Ecualizador (Shade)">▬</button>
        <button id="wsz-eq-close" class="wsz-panel-close-btn" title="Cerrar Ecualizador">×</button>

        <div class="wsz-eq-shade-controls">
          <div class="wsz-eq-shade-vol">
            <div id="wsz-eq-shade-vol-thumb" class="wsz-eq-shade-thumb"></div>
            <input id="wsz-eq-shade-vol-input" class="wsz-eq-shade-input" type="range" min="0" max="100" value="80" title="Volumen" />
          </div>
          <div class="wsz-eq-shade-bal">
            <div id="wsz-eq-shade-bal-thumb" class="wsz-eq-shade-thumb"></div>
            <input id="wsz-eq-shade-bal-input" class="wsz-eq-shade-input" type="range" min="-100" max="100" value="0" title="Balance" />
          </div>
        </div>

        <button id="wsz-eq-on" class="wsz-eq-on-btn eq-full-only active" title="Encender / apagar Ecualizador">ON</button>
        <button id="wsz-eq-auto" class="wsz-eq-auto-btn eq-full-only" title="Restablecer EQ a 0 dB (Flat)">AUTO</button>
        <canvas id="wsz-eq-graph" class="wsz-eq-graph eq-full-only" width="113" height="19" title="Curva de ecualización"></canvas>
        <button id="wsz-eq-presets-btn" class="wsz-eq-presets-btn eq-full-only" title="Elegir preset de ecualización">PRESETS</button>

        <div id="wsz-presets-menu" class="wsz-presets-menu eq-full-only hidden"></div>
        <div id="wsz-eq-sliders" class="eq-full-only"></div>
      </div>
    </div>

    <!-- 3. Playlist con marco 9-slice fiel de pledit.bmp y barra de scroll .wsz real -->
    <section id="playlist-section" class="playlist-section normal-only">
      <!-- Barra resumida de Playlist (275x14 en Shade Mode) -->
      <div id="pl-shade-scale-wrap" class="pl-shade-scale-wrap">
        <div class="pl-shade-bar">
          <div class="pl-shade-left"></div>
          <div class="pl-shade-mid"></div>
          <div class="pl-shade-right"></div>
          <span id="pl-shade-track" class="pl-shade-track">EXUM PLAYLIST — SIN CANCIÓN</span>
          <span id="pl-shade-dur" class="pl-shade-dur">0:00</span>
          <button id="pl-shade-unshade" class="wsz-panel-min-btn" title="Expandir Playlist">▬</button>
          <button id="pl-shade-close" class="wsz-panel-close-btn" title="Cerrar Playlist">×</button>
        </div>
      </div>

      <!-- Cabecera fiel de pledit.bmp (275x20 escalada: 5 piezas sin repetir títulos) -->
      <div id="pl-top-scale-wrap" class="pl-top-scale-wrap pl-full-only">
        <div class="pl-top-bar">
          <div class="pl-top-left"></div>
          <div class="pl-top-fill-left"></div>
          <div class="pl-top-title"></div>
          <div class="pl-top-fill-right"></div>
          <div class="pl-top-right"></div>
          <span class="pl-top-fallback-title">EXUM PLAYLIST</span>
          <span id="playlist-count" class="pl-top-fallback-count">0 pistas</span>
          <button id="pl-win-min" class="wsz-panel-min-btn" title="Resumir Playlist (Shade)">▬</button>
          <button id="pl-win-close" class="wsz-panel-close-btn" title="Cerrar Playlist">×</button>
        </div>
      </div>

      <!-- Cuadrícula central con bordes laterales y barra de scroll reales de pledit.bmp -->
      <div class="pl-middle-frame pl-full-only">
        <div id="pl-side-left" class="pl-side-left"></div>
        <div id="playlist-container" class="playlist-list">
          <div class="playlist-empty">
            Arrastra archivos de música o skins <strong>.wsz</strong> aquí, o usa <strong>ADD</strong>.
          </div>
        </div>
        <div id="pl-side-right" class="pl-side-right">
          <div id="pl-scroll-track" class="pl-scroll-track" title="Desplazar lista de canciones">
            <div id="pl-scroll-thumb" class="pl-scroll-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Barra inferior clásica pledit.bmp (275x38 escalada exacto con la skin) -->
      <div id="pl-classic-scale-wrap" class="pl-classic-scale-wrap pl-full-only">
        <div class="pl-classic-bar">
          <div class="pl-classic-left"></div>
          <div class="pl-classic-right"></div>

          <button id="pl-btn-add" class="pl-sprite-btn" title="Agregar (Archivos / Carpeta / URL)">ADD</button>
          <button id="pl-btn-rem" class="pl-sprite-btn" title="Quitar / Recortar / Limpiar">REM</button>
          <button id="pl-btn-sel" class="pl-sprite-btn" title="Seleccionar pistas">SEL</button>
          <button id="pl-btn-misc" class="pl-sprite-btn" title="Ordenar / Mezclar / Invertir">MISC</button>

          <div id="pl-total-time" class="pl-total-time">00:00/00:00</div>

          <div class="pl-mini-transport">
            <button id="pl-mini-prev" class="pl-mini-btn" title="Anterior">⏮</button>
            <button id="pl-mini-play" class="pl-mini-btn" title="Play">▶</button>
            <button id="pl-mini-pause" class="pl-mini-btn" title="Pause">⏸</button>
            <button id="pl-mini-stop" class="pl-mini-btn" title="Stop">⏹</button>
            <button id="pl-mini-next" class="pl-mini-btn" title="Siguiente">⏭</button>
            <button id="pl-mini-eject" class="pl-mini-btn" title="Abrir archivos">⏏</button>
          </div>

          <button id="pl-btn-list" class="pl-sprite-btn" title="Playlists guardadas y .m3u">LIST</button>

          <!-- Menús emergentes de Playlist (sin emojis) -->
          <div id="pl-menu-add" class="wsz-popup-menu pl-menu-up hidden" style="left: 11px;">
            <button class="wsz-menu-item" data-pl-action="add-files">Agregar archivos</button>
            <button class="wsz-menu-item" data-pl-action="add-folder">Elegir carpeta</button>
            <button class="wsz-menu-item" data-pl-action="add-url">Explorar / Radio (LIB)</button>
          </div>

          <div id="pl-menu-rem" class="wsz-popup-menu pl-menu-up hidden" style="left: 40px;">
            <button class="wsz-menu-item" data-pl-action="rem-selected">Quitar seleccionadas</button>
            <button class="wsz-menu-item" data-pl-action="rem-crop">Recortar (solo sel.)</button>
            <button class="wsz-menu-item" data-pl-action="rem-dupes">Quitar duplicados</button>
            <button class="wsz-menu-item" data-pl-action="rem-all">Limpiar toda la lista</button>
          </div>

          <div id="pl-menu-sel" class="wsz-popup-menu pl-menu-up hidden" style="left: 69px;">
            <button class="wsz-menu-item" data-pl-action="sel-all">Seleccionar todo</button>
            <button class="wsz-menu-item" data-pl-action="sel-none">Deseleccionar todo</button>
            <button class="wsz-menu-item" data-pl-action="sel-inv">Invertir selección</button>
          </div>

          <div id="pl-menu-misc" class="wsz-popup-menu pl-menu-up hidden" style="left: 98px;">
            <button class="wsz-menu-item" data-pl-action="sort-title">Ordenar por título</button>
            <button class="wsz-menu-item" data-pl-action="sort-artist">Ordenar por artista</button>
            <button class="wsz-menu-item" data-pl-action="sort-duration">Ordenar por duración</button>
            <div class="wsz-menu-sep"></div>
            <button class="wsz-menu-item" data-pl-action="misc-shuffle">Mezclar orden</button>
            <button class="wsz-menu-item" data-pl-action="misc-reverse">Invertir orden</button>
          </div>

          <div id="pl-menu-list" class="wsz-popup-menu pl-menu-up pl-menu-right hidden">
            <div class="pl-save-inline">
              <input id="pl-save-name" class="pl-save-input" type="text" placeholder="Nombre de playlist..." />
              <button id="pl-save-confirm" class="pl-save-go" title="Guardar playlist">OK</button>
            </div>
            <div id="pl-saved-items" class="pl-saved-items"></div>
            <div class="wsz-menu-sep"></div>
            <button class="wsz-menu-item" data-pl-action="list-new">Nueva lista vacía</button>
            <button class="wsz-menu-item" data-pl-action="list-import">Importar .m3u</button>
            <button class="wsz-menu-item" data-pl-action="list-export">Exportar .m3u</button>
          </div>
        </div>
      </div>

      <!-- Tira fina de utilidades Exum (Buscador + LIB / LRC / SKINS) -->
      <div class="playlist-footer pl-full-only">
        <input id="search-input" class="pl-search" type="text" placeholder="Buscar canción o artista..." />
        <button id="btn-sources" class="pl-btn" title="Biblioteca local, Explorador libre y Radios">LIB</button>
        <button id="btn-lyrics" class="pl-btn" title="Abrir ventana flotante de Letras">LRC</button>
        <button id="btn-skins" class="pl-btn" title="Abrir gestor y museo de Skins .wsz">SKINS</button>
      </div>
    </section>

    <!-- Overlay Drag & Drop -->
    <div id="drop-overlay" class="drop-overlay">
      <div class="drop-overlay-box">Suelta música (MP3/FLAC/WAV) o una skin Winamp (.wsz) aquí</div>
    </div>
  </div>

  <script type="module" src="./dist/renderer/app.js"></script>
</body>
</html>
