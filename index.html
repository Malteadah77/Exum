<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; media-src 'self' file: http: https:; img-src 'self' data:; style-src 'self' 'unsafe-inline';"
  />
  <title>Exum</title>
  <link rel="stylesheet" href="./styles/classic.css" />
</head>
<body>
  <div id="player-shell" class="player-shell">
    <!-- Modo Mini-Barra Flotante (Shade Mode) -->
    <section id="mini-bar" class="mini-bar">
      <div class="mini-info">
        <span id="mini-time" class="mini-time">00:00</span>
        <span id="mini-title" class="mini-title">Exum — Sin canción</span>
      </div>
      <div class="mini-controls">
        <button id="mini-prev" class="mini-btn" title="Anterior">⏮</button>
        <button id="mini-play" class="mini-btn" title="Play / Pause">⏯</button>
        <button id="mini-next" class="mini-btn" title="Siguiente">⏭</button>
        <button id="mini-restore" class="mini-btn" title="Restaurar tamaño">⤢</button>
      </div>
    </section>

    <!-- Bloque Winamp (275px base que escala proporcionalmente al 100% del ancho de ventana) -->
    <div id="winamp-decks" class="winamp-decks normal-only">
      <!-- 1. Main Deck (275x116) -->
      <div class="wsz-main-deck">
        <div class="wsz-titlebar">
          <span class="wsz-fallback-brand">EXUM v0.6</span>
          <button id="wsz-win-min" class="wsz-win-btn" title="Minimizar">_</button>
          <button id="wsz-win-shade" class="wsz-win-btn" title="Modo mini-barra flotante">▬</button>
          <button id="wsz-win-close" class="wsz-win-btn" title="Cerrar">×</button>
        </div>

        <div class="wsz-clock">
          <span id="wsz-d0" class="wsz-digit">0</span>
          <span class="wsz-digit-gap"></span>
          <span id="wsz-d1" class="wsz-digit">0</span>
          <span class="wsz-digit-colon">:</span>
          <span id="wsz-d2" class="wsz-digit">0</span>
          <span class="wsz-digit-gap"></span>
          <span id="wsz-d3" class="wsz-digit">0</span>
        </div>

        <canvas
          id="wsz-vis-canvas"
          class="wsz-vis-canvas"
          width="76"
          height="16"
          title="Clic para cambiar visualizador (Barras / Onda / Off)"
        ></canvas>

        <!-- Cuadrícula exacta del título (top:24, left:111, 154x12) -->
        <div id="wsz-track-title" class="wsz-track-title">EXUM — ARRASTRA MP3 O ELIGE CARPETA</div>

        <!-- Volumen (68x13 en x:107, y:57) -->
        <div class="wsz-vol-wrap">
          <div id="wsz-vol-bg" class="wsz-vol-bg"></div>
          <input id="wsz-vol-slider" class="wsz-vol-slider" type="range" min="0" max="100" value="80" title="Volumen" />
        </div>

        <!-- Balance Izq/Der (38x13 en x:177, y:57) -->
        <div class="wsz-bal-wrap">
          <div id="wsz-bal-bg" class="wsz-bal-bg"></div>
          <input id="wsz-bal-slider" class="wsz-bal-slider" type="range" min="-100" max="100" value="0" title="Balance (doble clic para centrar)" />
        </div>

        <!-- Botones EQ y PL -->
        <button id="wsz-btn-eq-toggle" class="wsz-eq-toggle active" title="Mostrar / ocultar Ecualizador">EQ</button>
        <button id="wsz-btn-pl-toggle" class="wsz-pl-toggle active" title="Mostrar / ocultar Playlist">PL</button>

        <!-- Barra de progreso -->
        <div class="wsz-pos-wrap">
          <div id="wsz-pos-thumb" class="wsz-pos-thumb"></div>
          <input id="wsz-pos-slider" class="wsz-pos-slider" type="range" min="0" max="0" step="0.1" value="0" />
        </div>

        <!-- Transporte -->
        <button id="wsz-btn-prev" class="wsz-cbtn" title="Anterior">⏮</button>
        <button id="wsz-btn-play" class="wsz-cbtn" title="Play">▶</button>
        <button id="wsz-btn-pause" class="wsz-cbtn" title="Pause">⏸</button>
        <button id="wsz-btn-stop" class="wsz-cbtn" title="Stop">⏹</button>
        <button id="wsz-btn-next" class="wsz-cbtn" title="Siguiente">⏭</button>
        <button id="wsz-btn-eject" class="wsz-cbtn" title="Agregar archivos">⏏</button>

        <button id="wsz-btn-shuffle" class="wsz-shufrep-btn" title="Aleatorio">SHUF</button>
        <button id="wsz-btn-repeat" class="wsz-shufrep-btn" title="Repetir">REP</button>
      </div>

      <!-- 2. Equalizer Deck (275x116) -->
      <div id="wsz-eq-deck" class="wsz-eq-deck">
        <button id="wsz-eq-on" class="wsz-eq-on-btn active" title="Encender / apagar Ecualizador">ON</button>
        <button id="wsz-eq-auto" class="wsz-eq-auto-btn" title="Restablecer EQ a 0 dB (Flat)">AUTO</button>
        <button id="wsz-eq-presets-btn" class="wsz-eq-presets-btn" title="Elegir preset de ecualización">PRESETS</button>

        <!-- Menú desplegable de Presets -->
        <div id="wsz-presets-menu" class="wsz-presets-menu hidden"></div>

        <!-- Preamp + 10 bandas renderizadas con sprites de eqmain.bmp -->
        <div id="wsz-eq-sliders"></div>
      </div>
    </div>

    <!-- 3. Playlist fluida -->
    <section id="playlist-section" class="playlist-section normal-only">
      <div class="playlist-header">
        <span class="playlist-title-fallback">EXUM PLAYLIST</span>
        <span id="playlist-count" class="playlist-count-pill">0 pistas</span>
      </div>

      <div id="playlist-container" class="playlist-list">
        <div class="playlist-empty">
          Arrastra archivos de música o skins <strong>.wsz</strong> aquí, o presiona <strong>📁</strong>.
        </div>
      </div>

      <div class="playlist-footer">
        <button id="btn-folder" class="pl-btn" title="Elegir carpeta dedicada de música">📁</button>
        <button id="btn-open" class="pl-btn" title="Agregar archivos sueltos">+</button>
        <input id="search-input" class="pl-search" type="text" placeholder="Buscar..." />
        <button id="btn-sources" class="pl-btn" title="Radios / Streams URL y Spotify">NET</button>
        <button id="btn-lyrics" class="pl-btn" title="Abrir ventana flotante de Letras">LRC</button>
        <button id="btn-skins" class="pl-btn" title="Abrir gestor y museo de Skins .wsz">SKINS</button>
      </div>
    </section>

    <!-- Overlay Drag & Drop -->
    <div id="drop-overlay" class="drop-overlay">
      <div class="drop-overlay-box">Suelta música (MP3/FLAC/WAV) o una skin Winamp (.wsz) aquí</div>
    </div>
  </div>

  <script type="module" src="./dist/renderer/app.js"></script>
</body>
</html>
